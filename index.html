<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Office Log</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Special+Elite&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#000;
  --card:#f4f4f4;
  --ink:#111;
  --border:#ddd;
}

*{box-sizing:border-box;}

body{
  margin:0;
  min-height:100vh;
  background:var(--bg);
  font-family:monospace;
  color:var(--ink);
  overflow-x:hidden;
}

/* TITLE */
.page-title{
  position:fixed;
  top:14px;
  width:100%;
  display:flex;
  justify-content:center;
  align-items:center;
  gap:12px;
  color:#f4f4f4;
  font-size:20px;
  letter-spacing:2px;
}

.computer-img-container img{
  width:40px;
}

/* CLOCK */
.widget{
  position:fixed;
  top:70px;
  left:50%;
  transform:translateX(-50%);
}

.box{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:18px;
  padding:10px 14px;
}

.clock{
  display:flex;
  gap:6px;
}

/* SMALLER DOT CLOCK */
.digit{
  display:grid;
  grid-template-columns:repeat(5,4px);
  grid-template-rows:repeat(7,4px);
  gap:2px;
}

.dot{
  width:4px;
  height:4px;
  border-radius:50%;
  background:transparent;
}

.dot.on{
  background:var(--ink);
}

.colon{
  display:grid;
  grid-template-rows:repeat(7,4px);
  gap:2px;
}

.colon .dot:nth-child(3),
.colon .dot:nth-child(5){
  background:var(--ink);
}

.space{
  width:6px;
}

/* DATE */
.dateAndShiftTime{
  position:fixed;
  top:150px;
  width:100%;
  text-align:center;
  color:#a0a0a0;
}

.date{
  font-size:20px;
}

/* HISTORY BUTTON */
.history-bar{
  position:fixed;
  top:220px;
  width:100%;
  text-align:center;
}

.history-bar button{
  padding:12px 22px;
  border-radius:14px;
  border:1px solid var(--border);
  background:var(--card);
}

/* STATUS */
.status-text{
  position:fixed;
  top:275px;
  left:50%;
  transform:translateX(-50%);
  width:90%;
  background:var(--card);
  padding:14px;
  border-radius:18px;
  border:1px solid var(--border);
  text-align:center;
  font-size:15px;
}

/* ENTRY TIME */
.entryTimeContainer{
  position:fixed;
  top:330px;
  left:50%;
  transform:translateX(-50%);
  width:90%;
  background:#2c2d2f;
  color:#c3c3c3;
  padding:14px;
  border-radius:18px;
  display:flex;
  justify-content:center;
  gap:10px;
}

.entryTimeContainer p{
  margin:0;
}

.entryTime{
  color:#63bc9e;
}

/* TYPEWRITER IMAGE */
.img-container{
  position:fixed;
  top:390px;
  width:100%;
  text-align:center;
}

.img-container img{
  width:140px;
}

/* BOTTOM BAR */
.bottom-bar{
  position:fixed;
  bottom:20px;
  width:100%;
  display:flex;
  gap:10px;
  padding:10px;
}

.bottom-bar button{
  flex:1;
  padding:18px;
  font-size:16px;
  border-radius:16px;
  border:none;
  background:var(--card);
}

.bottom-bar button:disabled{
  opacity:0.35;
}

/* MODAL */
.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.7);
  display:none;
  z-index:20;
}

.modal-content{
  background:var(--card);
  margin:20% auto;
  padding:16px;
  border-radius:18px;
  width:92%;
  max-height:75%;
  overflow-y:auto;
}

.history-item{
  background:#fff;
  border-radius:14px;
  padding:12px;
  margin-bottom:10px;
  font-size:13px;
  position:relative;
}

.history-item button{
  margin-top:10px;
  padding:8px 14px;
  border:none;
  border-radius:10px;
  background:#111;
  color:white;
  font-family:monospace;
}

/* EDIT MODAL */
.edit-modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.75);
  display:none;
  z-index:30;
}

.edit-content{
  background:var(--card);
  margin:15% auto;
  padding:18px;
  border-radius:18px;
  width:92%;
  max-width:420px;
}

.edit-content h3{
  margin-top:0;
}

.edit-content label{
  display:block;
  margin-top:12px;
  margin-bottom:5px;
  font-size:13px;
}

.edit-content input{
  width:100%;
  padding:12px;
  border:1px solid #ccc;
  border-radius:10px;
  font-family:monospace;
  font-size:15px;
}

.edit-buttons{
  display:flex;
  gap:10px;
  margin-top:18px;
}

.edit-buttons button{
  flex:1;
  padding:13px;
  border:none;
  border-radius:12px;
  font-family:monospace;
  font-size:15px;
}

.save-edit{
  background:#111;
  color:white;
}

.cancel-edit{
  background:#ddd;
}
</style>
</head>

<body>

<div class="page-title">
  <div class="computer-img-container">
    <img src="https://png.pngtree.com/png-vector/20231214/ourmid/pngtree-code-one-thousand-two-four-programmers-day-old-computer-vintage-computer-png-image_11353578.png">
  </div>
  <p>OFFICE LOG</p>
</div>

<div class="widget">
  <div class="box">
    <div class="clock" id="clock"></div>
  </div>
</div>

<div class="dateAndShiftTime">
  <div class="date"></div>
  <div>Shift: 01:30 PM - 10:30 PM</div>
</div>

<div class="history-bar">
  <button onclick="toggleHistory()">HISTORY</button>
</div>

<div class="status-text" id="statusText">
  Click enter to Log ⬇️
</div>

<div class="entryTimeContainer">
  <p>Entry time:</p>
  <div class="entryTime"></div>
</div>

<div class="img-container">
  <img src="https://png.pngtree.com/png-vector/20230811/ourmid/pngtree-cartoon-typewriter-cartoon-symbol-vector-illustration-background-png-image_6842029.png">
</div>

<div class="bottom-bar">
  <button id="enterBtn" onclick="enterOffice()">ENTER</button>
  <button id="exitBtn" onclick="exitOffice()" disabled>EXIT</button>
</div>

<!-- HISTORY MODAL -->
<div class="modal" id="historyModal" onclick="toggleHistory()">
  <div class="modal-content" onclick="event.stopPropagation()">
    <h3>OFFICE LOG 🪪</h3>
    <div id="historyList"></div>
  </div>
</div>

<!-- EDIT MODAL -->
<div class="edit-modal" id="editModal" onclick="closeEdit()">
  <div class="edit-content" onclick="event.stopPropagation()">

    <h3>EDIT OFFICE LOG ✏️</h3>

    <label for="editDate">Date</label>
    <input type="date" id="editDate">

    <label for="editEnter">Enter time</label>
    <input type="time" id="editEnter">

    <label for="editExit">Exit time</label>
    <input type="time" id="editExit">

    <div class="edit-buttons">
      <button class="cancel-edit" onclick="closeEdit()">CANCEL</button>
      <button class="save-edit" onclick="saveEdit()">SAVE</button>
    </div>

  </div>
</div>

<script>

const GLYPHS={
"0":["11111","10001","10001","10001","10001","10001","11111"],
"1":["00100","01100","00100","00100","00100","00100","01110"],
"2":["11111","00001","00001","11111","10000","10000","11111"],
"3":["11111","00001","00001","01111","00001","00001","11111"],
"4":["10001","10001","10001","11111","00001","00001","00001"],
"5":["11111","10000","10000","11111","00001","00001","11111"],
"6":["11111","10000","10000","11111","10001","10001","11111"],
"7":["11111","00001","00010","00100","00100","00100","00100"],
"8":["11111","10001","10001","11111","10001","10001","11111"],
"9":["11111","10001","10001","11111","00001","00001","11111"],
"A":["01110","10001","10001","11111","10001","10001","10001"],
"P":["11110","10001","10001","11110","10000","10000","10000"],
"M":["10001","11011","10101","10101","10001","10001","10001"]
};

function createGlyph(c){

 if(c===":"){
  const d=document.createElement("div");
  d.className="colon";

  for(let i=0;i<7;i++){
    const dot=document.createElement("div");
    dot.className="dot";
    d.appendChild(dot);
  }

  return d;
 }

 if(c===" "){
  const s=document.createElement("div");
  s.className="space";
  return s;
 }

 const d=document.createElement("div");
 d.className="digit";

 GLYPHS[c].forEach(r=>{
  r.split("").forEach(b=>{
    const dot=document.createElement("div");
    dot.className="dot"+(b==="1"?" on":"");
    d.appendChild(dot);
  });
 });

 return d;
}

function updateClock(){

 const clock=document.getElementById("clock");
 clock.innerHTML="";

 const n=new Date();

 let h=n.getHours();
 let m=String(n.getMinutes()).padStart(2,"0");

 const ap=h>=12?"PM":"AM";

 h=h%12||12;

 [...`${String(h).padStart(2,"0")}:${m} ${ap}`]
 .forEach(c=>clock.appendChild(createGlyph(c)));
}

updateClock();
setInterval(updateClock,1000);


/* =========================
   OFFICE LOG
========================= */

const today=new Date().toISOString().split("T")[0];

/*
 IMPORTANT:
 This is the SAME localStorage key used by your old version.
 No migration or new storage is being used.
*/
let officeData=JSON.parse(
 localStorage.getItem("officeData") || "[]"
);

function formatTime(d){

 return d.toLocaleTimeString([],{
  hour:'2-digit',
  minute:'2-digit'
 });

}

function formatDateDMY(ds){

 const d=new Date(ds);

 return `${d.getDate()}-${d.toLocaleString('en',{
   month:'short'
 })}-${d.getFullYear()}`;

}


/* Convert HH:MM to minutes */
function timeToMinutes(time){

 const parts=time.split(":");

 return Number(parts[0])*60 + Number(parts[1]);

}


/* Calculate total between enter and exit */
function calculateTotal(enter,exit){

 let enterMinutes=timeToMinutes(enter);
 let exitMinutes=timeToMinutes(exit);

 /*
  If exit is earlier than enter,
  assume the shift crossed midnight.
 */
 if(exitMinutes < enterMinutes){
   exitMinutes += 24*60;
 }

 const mins=exitMinutes-enterMinutes;

 return `${String(Math.floor(mins/60)).padStart(2,"0")}:${String(mins%60).padStart(2,"0")}`;

}


/* =========================
   ENTER
========================= */

function enterOffice(){

 const now=new Date();

 localStorage.setItem(
   "todayEnter",
   now.getTime()
 );

 localStorage.setItem(
   "officeStatus",
   "IN"
 );

 enterBtn.disabled=true;
 exitBtn.disabled=false;

 statusText.innerText="🟢 You are IN office";

 document.querySelector(".entryTime").innerText=
   formatTime(now);

}


/* =========================
   EXIT
========================= */

function exitOffice(){

 const enter=new Date(
   +localStorage.getItem("todayEnter")
 );

 const exit=new Date();

 const mins=Math.floor(
   (exit-enter)/60000
 );

 officeData.push({

   date:today,

   enter:formatTime(enter),

   exit:formatTime(exit),

   total:
     `${String(Math.floor(mins/60)).padStart(2,"0")}:${String(mins%60).padStart(2,"0")}`

 });

 /*
  SAME old storage.
 */
 localStorage.setItem(
   "officeData",
   JSON.stringify(officeData)
 );

 localStorage.setItem(
   "officeStatus",
   "OUT"
 );

 localStorage.removeItem(
   "todayEnter"
 );

 enterBtn.disabled=false;
 exitBtn.disabled=true;

 statusText.innerText="Click enter to Log ⬇️";

}


/* =========================
   HISTORY
========================= */

function toggleHistory(){

 historyModal.style.display=
   historyModal.style.display==="block"
   ?"none"
   :"block";

 renderHistory();

}


/* =========================
   RENDER HISTORY
========================= */

function renderHistory(){

 historyList.innerHTML="";

 if(officeData.length===0){

   historyList.innerHTML=
     "<p>No office records yet.</p>";

   return;
 }

 officeData.slice().reverse().forEach((d,index)=>{

   /*
    Because the array is reversed,
    calculate the real array index.
   */
   const realIndex=
     officeData.length-1-index;

   historyList.innerHTML+=`

   <div class="history-item">

     DATE: ${formatDateDMY(d.date)}<br>

     ENTER: ${d.enter}<br>

     EXIT: ${d.exit}<br>

     TOTAL: ${d.total}

     <br>

     <button onclick="openEdit(${realIndex})">
       ✏️ EDIT
     </button>

   </div>

   `;

 });

}


/* =========================
   OPEN EDIT
========================= */

let editingIndex=null;

function openEdit(index){

 editingIndex=index;

 const record=officeData[index];

 /*
  Existing old records already contain
  date, enter and exit.
 */
 document.getElementById("editDate").value=
   record.date || "";

 document.getElementById("editEnter").value=
   convertTo24Hour(record.enter);

 document.getElementById("editExit").value=
   convertTo24Hour(record.exit);

 editModal.style.display="block";

}


/* =========================
   CONVERT 12-HOUR TIME
   TO HTML TIME FORMAT
========================= */

function convertTo24Hour(time){

 if(!time) return "";

 /*
  If an old/custom record is already HH:MM,
  use it directly.
 */
 if(!time.includes("AM") && !time.includes("PM")){
   return time;
 }

 const parts=time.trim().split(" ");

 const hm=parts[0];
 const ampm=parts[1];

 let [hours,minutes]=hm.split(":").map(Number);

 if(ampm==="PM" && hours!==12){
   hours+=12;
 }

 if(ampm==="AM" && hours===12){
   hours=0;
 }

 return `${String(hours).padStart(2,"0")}:${String(minutes).padStart(2,"0")}`;

}


/* =========================
   CONVERT 24-HOUR TIME
   TO DISPLAY TIME
========================= */

function convertTo12Hour(time){

 const [hours,minutes]=time.split(":").map(Number);

 const ampm=hours>=12?"PM":"AM";

 let h=hours%12||12;

 return `${String(h).padStart(2,"0")}:${String(minutes).padStart(2,"0")} ${ampm}`;

}


/* =========================
   SAVE EDIT
========================= */

function saveEdit(){

 if(editingIndex===null){
   return;
 }

 const date=
   document.getElementById("editDate").value;

 const enter=
   document.getElementById("editEnter").value;

 const exit=
   document.getElementById("editExit").value;

 if(!date || !enter || !exit){

   alert("Please enter date, enter time and exit time.");

   return;
 }

 /*
  Update the EXISTING object.
  No new storage structure is created.
 */
 officeData[editingIndex].date=date;

 officeData[editingIndex].enter=
   convertTo12Hour(enter);

 officeData[editingIndex].exit=
   convertTo12Hour(exit);

 officeData[editingIndex].total=
   calculateTotal(enter,exit);

 /*
  Save back to the SAME localStorage key.
 */
 localStorage.setItem(
   "officeData",
   JSON.stringify(officeData)
 );

 editingIndex=null;

 closeEdit();

 renderHistory();

}


/* =========================
   CLOSE EDIT
========================= */

function closeEdit(){

 editModal.style.display="none";

 editingIndex=null;

}


/* =========================
   CURRENT STATUS
========================= */

document.querySelector(".date").innerText=
 formatDateDMY(today);


if(localStorage.getItem("officeStatus")==="IN"){

 enterBtn.disabled=true;

 exitBtn.disabled=false;

 document.querySelector(".entryTime").innerText=
   formatTime(
     new Date(
       +localStorage.getItem("todayEnter")
     )
   );

 statusText.innerText=
   "🟢 You are IN office";

}

</script>

</body>
</html>
